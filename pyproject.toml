[project]
name = "live-translator"
version = "0.1.0"
description = "Real-time Spanish to English voice-to-voice translator. Offline, open source, edge-friendly."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nicolay" }]

dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26,<2.0",
    "silero-vad>=5.1",
    "piper-tts>=1.2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
live-translator = "live_translator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_translator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
